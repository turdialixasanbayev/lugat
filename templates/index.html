<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lug'at</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --accent: #2563eb;
            --border-color: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 16px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Direction Switcher Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            padding: 12px 20px;
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
        }

        .lang-box {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .flag {
            width: 24px;
            height: 18px;
            object-fit: cover;
            border-radius: 2px;
            box-shadow: 0 0 2px rgba(0, 0, 0, 0.2);
        }

        .swap-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-primary);
        }

        .swap-btn:hover {
            background-color: #f1f5f9;
        }

        /* Search Form */
        .search-form {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-icon {
            position: absolute;
            left: 16px;
            color: var(--text-secondary);
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            padding: 16px 16px 16px 48px;
            font-size: 1.05rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            outline: none;
            background: var(--card-bg);
            color: var(--text-primary);
            box-shadow: var(--shadow);
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent);
        }

        /* Result Area */
        .result-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
        }

        .word-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .translation-text {
            font-size: 1.2rem;
            color: var(--accent);
            font-weight: 600;
        }

        .not-found {
            color: var(--text-secondary);
            font-size: 1rem;
            text-align: center;
        }

        @media (max-width: 480px) {
            body {
                padding: 20px 12px;
            }

            .lang-text {
                display: none;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- Yo'nalishni almashtirish Formasi -->
        <form method="GET" action="" id="direction-form">
            <!-- Joriy yo'nalishni saqlab qolish uchun hidden input -->
            <input type="hidden" name="direction" id="direction-input" value="{{ direction|default:'en_uz' }}">
            <input type="hidden" name="q" value="{{ searched_word }}">

            <div class="header">
                <div class="lang-box">
                    <!-- TO'G'RILANDI: {% if direction == 'uz_en' %}uz{% else %}gb{% endif %} -->
                    <img src="https://flagcdn.com/w40/{% if direction == 'uz_en' %}uz{% else %}gb{% endif %}.png"
                        class="flag" alt="Flag" id="source-flag">
                    <span class="lang-text" id="source-text">{% if direction == 'uz_en' %}O'zbekcha{% else %}Inglizcha{% endif %}</span>
                </div>

                <button type="button" class="swap-btn" id="swap-btn" title="Yo'nalishni almashtirish">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M7 16V4M7 4L3 8M7 4L11 8M17 8V20M17 20L21 16M17 20L13 16" />
                    </svg>
                </button>

                <div class="lang-box">
                    <img src="https://flagcdn.com/w40/{% if direction == 'uz_en' %}gb{% else %}uz{% endif %}.png"
                        class="flag" alt="Flag" id="target-flag">
                    <span class="lang-text" id="target-text">{% if direction == 'uz_en' %}Inglizcha{% else %}O'zbekcha{% endif %}</span>
                </div>
            </div>
        </form>

        <!-- Search Form -->
        <form method="GET" action="" class="search-form">
            <input type="hidden" name="direction" value="{{ direction|default:'en_uz' }}">
            <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" name="q" value="{{ searched_word|default:'' }}" class="search-input"
                placeholder="So'z kiriting va Enter bosing..." autocomplete="off">
        </form>

        <!-- Result Area -->
        {% if searched_word %}
        <div class="result-card">
            {% if translation %}
            <div class="word-title">{{ searched_word }}</div>
            <div class="translation-text">{{ translation }}</div>
            {% else %}
            <div class="not-found">Bunday so'z topilmadi.</div>
            {% endif %}
        </div>
        {% endif %}
    </div>

    <script>
        // Yo'nalishni almashtirish tugmasi bosilganda qiymatni o'zgartirib sahifani yuborish
        const swapBtn = document.getElementById('swap-btn');
        const directionInput = document.getElementById('direction-input');
        const directionForm = document.getElementById('direction-form');

        swapBtn.addEventListener('click', () => {
            if (directionInput.value === 'en_uz') {
                directionInput.value = 'uz_en';
            } else {
                directionInput.value = 'en_uz';
            }
            directionForm.submit();
        });
    </script>
</body>

</html>
